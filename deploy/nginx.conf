# Config nginx pour servir la SPA DressingAI (dans le conteneur Docker).
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Assets fingerprintés → cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker : jamais mis en cache (mises à jour immédiates)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA : toute route inconnue → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
