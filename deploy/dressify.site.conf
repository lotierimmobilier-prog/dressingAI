# Config nginx pour un déploiement SANS Docker (build statique servi par le
# nginx de l'hôte). À copier dans /etc/nginx/sites-available/dressify puis :
#   ln -s /etc/nginx/sites-available/dressify /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Adapte server_name et le chemin root vers ton dossier build (dist/).

server {
    listen 80;
    listen [::]:80;
    server_name dressify.exemple.com;   # <-- ton domaine ou _

    root /home/USER/dressingAI/dist;    # <-- chemin vers le build
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTTPS : après avoir pointé le domaine, lance `certbot --nginx` pour
    # obtenir un certificat Let's Encrypt automatiquement.
}
