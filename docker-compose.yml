# Déploiement DressingAI sur VPS via Docker Compose.
#   1) (optionnel) crée un fichier .env à côté de ce fichier avec tes clés VITE_*
#   2) docker compose up -d --build
#   3) l'app est servie sur http://VPS_IP:8080  (change le port si besoin)
services:
  dressingai:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_ANTHROPIC_API_KEY: ${VITE_ANTHROPIC_API_KEY:-}
        VITE_CLAUDE_MODEL: ${VITE_CLAUDE_MODEL:-claude-sonnet-5}
        VITE_OPENWEATHER_API_KEY: ${VITE_OPENWEATHER_API_KEY:-}
        VITE_CLAUDE_PROXY: ${VITE_CLAUDE_PROXY:-}
        VITE_BASE: ${VITE_BASE:-/}
        VITE_AMAZON_TAG: ${VITE_AMAZON_TAG:-}
        VITE_SHEIN_AFF: ${VITE_SHEIN_AFF:-}
        VITE_ZALANDO_AFF: ${VITE_ZALANDO_AFF:-}
        VITE_ASOS_AFF: ${VITE_ASOS_AFF:-}
    image: dressingai:latest
    container_name: dressingai
    restart: unless-stopped
    ports:
      - "8080:80"
